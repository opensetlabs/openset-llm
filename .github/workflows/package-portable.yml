name: package-portable

# Builds the portable x86-64 engine (every kernel variant, chosen at run time; no model weights) and packs it for
# ./install.sh --prebuilt and --bin-url. Runs when a release is published, and attaches the tarball and its checksum
# to that release. It can also be started by hand; then the tarball is only kept as a workflow artifact.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tarball_name:
        description: "Output tarball filename"
        required: false
        default: "openset-llm-linux-x86_64.tar.gz"

permissions:
  contents: read

env:
  TARBALL_NAME: ${{ inputs.tarball_name || 'openset-llm-linux-x86_64.tar.gz' }}

jobs:
  build-portable-linux:
    # the oldest runner image: the binaries need its glibc or newer
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build git ca-certificates

      - name: Build portable x86-64 engine (no model weights)
        run: |
          FORK_SHA=$(grep -m1 '^FORK_SHA=' install.sh | cut -d= -f2)
          FORK_URL=$(grep -m1 '^FORK_URL=' install.sh | cut -d= -f2)
          git clone -q "$FORK_URL" /tmp/llama.cpp
          git -C /tmp/llama.cpp checkout -q "$FORK_SHA"
          sh patches/apply.sh /tmp/llama.cpp
          cmake -S /tmp/llama.cpp -B /tmp/llama.cpp/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DLLAMA_CURL=OFF \
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF \
            -DGGML_NATIVE=OFF -DBUILD_SHARED_LIBS=ON \
            -DGGML_BACKEND_DL=ON -DGGML_CPU_ALL_VARIANTS=ON \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON '-DCMAKE_INSTALL_RPATH=$ORIGIN'
          cmake --build /tmp/llama.cpp/build -j"$(nproc)"
          mkdir -p "$HOME/.openset-llm/bin"
          cp -a /tmp/llama.cpp/build/bin/llama-server /tmp/llama.cpp/build/bin/*.so* "$HOME/.openset-llm/bin/"
          # the same extra tools ./install.sh --portable installs (bench/jobs.sh uses llama-bench)
          for tool in llama-bench llama-cli; do
            if [ -e "/tmp/llama.cpp/build/bin/$tool" ]; then cp -a "/tmp/llama.cpp/build/bin/$tool" "$HOME/.openset-llm/bin/"; fi
          done
          LD_LIBRARY_PATH="$HOME/.openset-llm/bin" "$HOME/.openset-llm/bin/llama-server" --version

      - name: Pack tarball and SHA256SUMS
        run: |
          bash scripts/package.sh "$TARBALL_NAME"
          sha256sum "$TARBALL_NAME" > SHA256SUMS
          cat SHA256SUMS

      - name: Upload portable artifact
        uses: actions/upload-artifact@v7
        with:
          name: openset-llm-portable-linux-x86_64
          path: |
            ${{ env.TARBALL_NAME }}
            SHA256SUMS
          retention-days: 14

  attach-to-release:
    # only this job may write to the repository, and only to add the two files to the release that triggered it
    if: github.event_name == 'release'
    needs: build-portable-linux
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: openset-llm-portable-linux-x86_64
      - name: Attach the tarball and its checksum to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" "$TARBALL_NAME" SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
