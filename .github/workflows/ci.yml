name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Shell scripts parse
        run: for f in install.sh get.sh serve start scripts/package.sh scripts/verify-dispatch.sh scripts/cross-aarch64.sh scripts/smoke-test.sh patches/apply.sh docker/entrypoint.sh bench/box.sh bench/jobs.sh bench/quick.sh; do bash -n "$f"; done
      - name: Python compiles
        run: python3 -m py_compile scripts/graft_mtp.py bench/*.py
      - name: Unit tests
        run: |
          python3 -m pip install -q --break-system-packages gguf numpy
          python3 -m unittest discover -s tests -p 'test_*.py'
          cd bench && python3 -m unittest discover -s . -p 'test_*.py'
      - name: Files the README links to exist
        run: |
          fail=0
          for f in $(grep -o -E '\]\(([A-Za-z0-9_./-]+)\)|(src|srcset)="[A-Za-z0-9_./-]+"' README.md | sed -E 's/^\]\(//; s/\)$//; s/^(src|srcset)="//; s/"$//' | sort -u); do
            [ -e "$f" ] || { echo "README links to a missing file: $f"; fail=1; }
          done
          exit $fail
